<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">SpamWall</title>
  <desc id="d">Pattern-based spam call and SMS blocking rules for Indian numbers</desc>
  <rect width="1200" height="300" fill="#0f172a"/>
  <g fill="#1e293b">
    <rect x="760" y="60" width="120" height="44" rx="4"/><rect x="890" y="60" width="120" height="44" rx="4"/><rect x="1020" y="60" width="120" height="44" rx="4"/>
    <rect x="700" y="114" width="120" height="44" rx="4"/><rect x="830" y="114" width="120" height="44" rx="4"/><rect x="960" y="114" width="120" height="44" rx="4"/><rect x="1090" y="114" width="80" height="44" rx="4"/>
    <rect x="760" y="168" width="120" height="44" rx="4"/><rect x="890" y="168" width="120" height="44" rx="4"/><rect x="1020" y="168" width="120" height="44" rx="4"/>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#f87171">
    <text x="772" y="89">^140\d{7}$</text><text x="842" y="143">^(3366|2250)</text><text x="902" y="197">call centres</text>
  </g>
  <text x="60" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f8fafc">SpamWall</text>
